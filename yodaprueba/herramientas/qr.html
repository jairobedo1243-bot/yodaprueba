<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Generador de QR · Figuras 3D</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/tema-dagobah.css">
  <style>
    .panel { display: grid; gap: 22px; padding: 40px 0 60px; }
    .campo { display: grid; gap: 6px; }
    .campo label { font-size: .85rem; letter-spacing: .06em; color: var(--texto-suave); }
    .campo input, .campo select {
      width: 100%; min-height: 46px; padding: .6rem .9rem;
      border: 1px solid var(--borde); border-radius: var(--radio-s);
      background: var(--surface); color: var(--texto); font: inherit;
    }
    .campo small { color: var(--texto-tenue); }
    .alerta {
      padding: .8rem 1rem; border-radius: var(--radio-s);
      border: 1px solid #7a5a2a; background: rgba(122, 90, 42, .18); color: #f0d9a8;
    }
    .vista { display: grid; justify-items: center; gap: 14px; text-align: center; }
    .vista__qr { width: min(80vw, 320px); padding: 12px; background: #fff; border-radius: 16px; }
    .vista__qr svg { width: 100%; height: auto; }
    .vista__url { font-size: .85rem; color: var(--texto-suave); word-break: break-all; max-width: 46ch; }
    .acciones { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    @media (min-width: 800px) { .panel { grid-template-columns: 1fr 360px; align-items: start; } }
    @media print {
      body { background: #fff !important; }
      .panel > .tarjeta:first-child, .acciones, h1, .sable, .atmosfera { display: none !important; }
      .vista__qr { width: 9cm; }
    }
  </style>
</head>
<body class="tema-dagobah">
  <div class="atmosfera" aria-hidden="true"><div class="niebla niebla--1"></div><div class="niebla niebla--2"></div></div>

  <div id="app">
    <main class="contenedor" id="contenido">
      <header style="padding-top:40px">
        <div class="sable" aria-hidden="true" style="margin-bottom:1rem"></div>
        <h1 style="font-size:clamp(1.9rem,8vw,2.8rem)">Generador de QR</h1>
        <p class="seccion__sub">Creá el código que vas a pegar en tu figura. Funciona sin internet.</p>
      </header>

      <div class="panel">
        <section class="tarjeta" aria-label="Datos del código">
          <div class="campo">
            <label for="figura">Figura</label>
            <select id="figura"><option value="yoda-01">yoda-01</option></select>
          </div>
          <div class="campo" style="margin-top:16px">
            <label for="base">Dirección de la página (la que van a abrir los celulares)</label>
            <input id="base" type="url" inputmode="url" autocomplete="off" spellcheck="false">
            <small>En una red local, usá la IP de tu PC en lugar de «localhost» (por ejemplo <code>http://192.168.1.20/yoda-qr/index.html</code>).</small>
          </div>
          <div class="campo" style="margin-top:16px">
            <label for="nivel">Corrección de errores</label>
            <select id="nivel">
              <option value="M">Media (recomendado para pantalla)</option>
              <option value="Q" selected>Alta (recomendado para imprimir)</option>
              <option value="H">Máxima (por si la impresión queda rugosa)</option>
            </select>
          </div>
          <p id="aviso-local" class="alerta" hidden style="margin-top:16px"></p>
        </section>

        <section class="tarjeta vista" aria-live="polite">
          <div class="vista__qr" id="qr" role="img" aria-label="Código QR de la figura"></div>
          <p class="vista__url" id="url-final"></p>
          <div class="acciones">
            <button type="button" class="boton boton--primario" id="bajar-png">Descargar PNG</button>
            <button type="button" class="boton" id="bajar-svg">Descargar SVG</button>
            <button type="button" class="boton" id="imprimir">Imprimir</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/vendor/qrcode.js"></script>
  <script src="../assets/js/qr.js"></script>
  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var selFigura = $('figura'), inBase = $('base'), selNivel = $('nivel');

    // Dirección sugerida: la carpeta de esta herramienta -> ../index.html
    // Dirección por defecto: tu GitHub Pages (editable). Si abrís esta herramienta desde el sitio
    // publicado o desde XAMPP, podés cambiarla por la dirección que corresponda.
    inBase.value = 'https://jairobedo1243-bot.github.io/yodaprueba/index.html';

    // Figuras reales de la base de datos (si la API responde)
    function cargarFiguras(url) {
      return fetch(url).then(function (r) { if (!r.ok) throw new Error(); return r.json(); });
    }
    // Con PHP lee la base; sin PHP (GitHub Pages) lee datos/figuras.json
    cargarFiguras('../api/figuras.php').catch(function () { return cargarFiguras('../datos/figuras.json'); }).then(function (d) {
      if (!d.figuras || !d.figuras.length) return;
      while (selFigura.firstChild) selFigura.removeChild(selFigura.firstChild);
      d.figuras.forEach(function (f) {
        var o = document.createElement('option');
        o.value = f.codigo;
        o.textContent = f.codigo + ' — ' + f.nombre;
        selFigura.appendChild(o);
      });
      dibujar();
    }).catch(function () { /* se usa el valor por defecto */ });

    function urlFinal() {
      var base = inBase.value.trim().split('#')[0].split('?')[0];
      return base + '?f=' + encodeURIComponent(selFigura.value);
    }

    function dibujar() {
      var url = urlFinal();
      var cont = $('qr');
      while (cont.firstChild) cont.removeChild(cont.firstChild);
      try { cont.appendChild(QR.svg(url, selNivel.value)); } catch (e) { cont.textContent = 'La dirección es demasiado larga.'; }
      $('url-final').textContent = url;

      var local = /^(https?:\/\/)?(localhost|127\.|\[::1\])/i.test(url);
      var aviso = $('aviso-local');
      aviso.hidden = !local;
      if (local) aviso.textContent = 'Atención: con «localhost» o 127.0.0.1 el QR solo funciona en esta computadora. Para que lo abran otros celulares, reemplazalo por la IP de tu PC en la red WiFi (en Windows: ejecutá ipconfig y mirá «Dirección IPv4»).';
    }

    function descargar(href, nombre) {
      var a = document.createElement('a');
      a.href = href; a.download = nombre;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }

    $('bajar-png').addEventListener('click', function () {
      descargar(QR.pngDataUrl(urlFinal(), 1200, selNivel.value), 'qr-' + selFigura.value + '.png');
    });
    $('bajar-svg').addEventListener('click', function () {
      var s = new XMLSerializer().serializeToString($('qr').firstChild);
      descargar('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s), 'qr-' + selFigura.value + '.svg');
    });
    $('imprimir').addEventListener('click', function () { window.print(); });

    [selFigura, inBase, selNivel].forEach(function (el) { el.addEventListener('input', dibujar); });
    dibujar();
  })();
  </script>
</body>
</html>
